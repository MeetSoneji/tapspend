name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain
      - name: Lint
        run: ./gradlew :app:lintDebug --console=plain
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain
      - name: Permission allowlist (no INTERNET, no location)
        run: ./scripts/check-permissions.sh
      - name: APK size budget (< 8 MB)
        run: |
          size=$(stat -c%s app/build/outputs/apk/release/*.apk | head -1)
          echo "release APK: $size bytes"
          test "$size" -lt 8388608
      - uses: actions/upload-artifact@v4
        with:
          name: apk-unsigned-or-signed
          path: app/build/outputs/apk/release/*.apk
